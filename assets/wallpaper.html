<!doctype html>
<!-- Source of assets/wallpaper.jpg. Re-render with: node tools/render_wallpaper.js -->
<html lang="en"><head><meta charset="utf-8"><title>DNSGuard wallpaper</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0b0d11;color:#e6e8ee;font-family:"Segoe UI",system-ui,Roboto,"DejaVu Sans",sans-serif;
 display:flex;align-items:center;justify-content:center;position:relative}
.bg{position:absolute;inset:0;
 background:
  radial-gradient(ellipse 900px 620px at 50% 46%,rgba(240,180,41,.10),transparent 70%),
  radial-gradient(ellipse 1400px 900px at 50% 50%,#151922 0%,#0b0d11 72%)}
.grid{position:absolute;inset:0;opacity:.35;
 background-image:radial-gradient(rgba(138,180,255,.18) 1px,transparent 1.4px);background-size:32px 32px;
 -webkit-mask-image:radial-gradient(ellipse 760px 520px at 50% 48%,#000 0%,transparent 75%)}
.wrap{position:relative;text-align:center;transform:translateY(-24px)}
svg{width:260px;height:260px;display:block;margin:0 auto 34px;filter:drop-shadow(0 18px 50px rgba(240,180,41,.25))}
.kicker{font-size:22px;letter-spacing:7px;text-transform:uppercase;color:#8a93a6;margin-bottom:14px}
h1{font-size:76px;font-weight:600;letter-spacing:.5px;line-height:1.05}
h1 b{font-weight:700;background:linear-gradient(180deg,#ffd36a,#f0b429 60%,#d99a12);-webkit-background-clip:text;color:transparent}
.rule{width:120px;height:3px;border-radius:2px;margin:30px auto 26px;background:linear-gradient(90deg,transparent,#f0b429,transparent)}
p{font-size:24px;color:#aab1c0;line-height:1.55}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap">
<svg viewBox="0 0 120 120" aria-hidden="true">
 <defs>
  <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232836"/><stop offset="1" stop-color="#151922"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36a"/><stop offset=".55" stop-color="#f0b429"/><stop offset="1" stop-color="#d48f0c"/></linearGradient>
 </defs>
 <!-- shield -->
 <path d="M60 6 L104 22 V56 C104 84 86 104 60 114 C34 104 16 84 16 56 V22 Z" fill="url(#sh)" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
 <path d="M60 15 L96 28 V56 C96 79 81 96 60 105 C39 96 24 79 24 56 V28 Z" fill="none" stroke="#f0b429" stroke-opacity=".18" stroke-width="1.5" stroke-linejoin="round"/>
 <!-- the block page's lock -->
 <g transform="translate(30 26) scale(2.5)" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
 </g>
 <circle cx="60" cy="64.75" r="3.2" fill="#f0b429"/>
 <path d="M60 66.5 V72" stroke="#f0b429" stroke-width="3" stroke-linecap="round"/>
</svg>
<div class="kicker">This computer is</div>
<h1>Protected by <b>DNSGuard</b></h1>
<div class="rule"></div>
<p>Internet access is filtered. Only approved websites are available.</p>
</div>
</body></html>
